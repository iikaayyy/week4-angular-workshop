<div class="container mt-4" style="max-width:640px">
    <h3>Live Chat</h3>
  
    <form (ngSubmit)="send()" class="d-flex gap-2 mb-3">
      <input class="form-control" [(ngModel)]="messageContent" name="messageContent" placeholder="Type a message..." />
      <button class="btn btn-primary" type="submit">Send</button>
    </form>
  
    <ul class="list-group">
      <li class="list-group-item" *ngFor="let m of messages">{{ m }}</li>
    </ul>
  </div>
